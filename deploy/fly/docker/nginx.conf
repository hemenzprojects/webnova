worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 8080;
        server_name _;  # catch-all — tenant domain routing is handled by Laravel middleware
        root /var/www/html/public;
        index index.php;

        # Fly.io health check
        location = /up {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Laravel: admin panel, API, Livewire
        location ~ ^/(admin|api|livewire|sanctum) {
            try_files $uri /index.php?$query_string;
        }

        # PHP-FPM handler
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_HOST $host;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_read_timeout 300;
        }

        # Filament CSS/JS assets (backend)
        location ^~ /css/ {
            alias /var/www/html/public/css/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ^~ /js/ {
            alias /var/www/html/public/js/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Uploaded files via storage symlink
        location ^~ /storage/ {
            alias /var/www/html/public/storage/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Nuxt built assets (hashed filenames — cache forever)
        location ^~ /_nuxt/ {
            alias /var/www/frontend/.output/public/_nuxt/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Nuxt public static files (favicon, images, etc.)
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            root /var/www/frontend/.output/public;
            try_files $uri @nuxt;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Everything else → Nuxt SSR
        location / {
            try_files $uri @nuxt;
        }

        location @nuxt {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }
}