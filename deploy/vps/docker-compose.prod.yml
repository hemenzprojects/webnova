services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: webnova_backend
    restart: unless-stopped
    network_mode: host
    working_dir: /var/www/html
    volumes:
      # Only mount .env file and storage directories, not the entire source code
      # Source code and vendor are baked into the Docker image
      - ./backend/.env:/var/www/html/.env
      - backend_storage:/var/www/html/storage/app
      - backend_logs:/var/www/html/storage/logs
    environment:
      - CONTAINER_ROLE=app
    depends_on:
      - mysql
      - redis

  # Nuxt Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NUXT_PUBLIC_API_BASE=https://www2.webnova.edu.gh/api/v1
        - NUXT_PUBLIC_BACKEND_URL=https://www2.webnova.edu.gh
        - NUXT_API_BASE_SSR=https://www2.webnova.edu.gh/api/v1
    container_name: webnova_frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=https://www2.webnova.edu.gh/api/v1
      - NUXT_PUBLIC_BACKEND_URL=https://www2.webnova.edu.gh
      - NUXT_API_BASE_SSR=https://www2.webnova.edu.gh/api/v1
    depends_on:
      - backend

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: webnova_mysql
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-webnova_db}
      MYSQL_USER: ${DB_USERNAME:-webnova_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: webnova_redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: webnova_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./backend/public:/var/www/backend/public:ro
      - backend_storage:/var/www/backend/storage:ro
      - ./frontend-public:/var/www/webnova/frontend-public:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local